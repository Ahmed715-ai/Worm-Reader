<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cyberpunk Terminal - WORM</title>
    <style>
        /* Base Styles and Layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Consolas', 'Courier New', monospace; /* Monospace terminal font */
            background-color: #000;
        }

        /* Dark blurred cityscape background */
        .terminal-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                              url('https://images.unsplash.com/photo-1549487922-b9868e8e7b3c?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxMTkyMXwwfDF8c2VhcmNofDExfHxjaXR5c2NhcGUlMjBibHVycmVkfGVufDB8fHx8MTY3ODk4OTUzOA&ixlib=rb-4.0.3&q=80&w=1920');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 40px;
        }

        /* Common pink text style */
        .pink-text {
            color: #ff00ff; /* Hot Pink */
            text-shadow: 0 0 5px #ff00ff;
            font-size: 14px;
            letter-spacing: 1.5px;
        }

        /* Top Bar Flex Layout */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 20px;
            left: 0;
            padding: 0 40px;
            box-sizing: border-box;
        }

        /* Main WORM title with correct styling */
        .worm-title {
            font-size: 120px;
            font-weight: bold;
            text-transform: uppercase;
            color: #ff00ff; /* Solid Pink Fill as requested */
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff; /* Powerful neon glow */
            letter-spacing: 15px;
            margin: 0;
            position: absolute;
            top: 100px;
            z-index: 10;
        }

        /* Main central glowing box */
        .glowing-box {
            border: 4px solid #ff00ff;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            width: 600px;
            height: 350px;
            box-sizing: border-box;
            position: relative;
            z-index: 5;
            margin-top: 150px;
        }

        /* Button rows with icons */
        .button-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* Skewed buttons */
        .terminal-button {
            flex-grow: 1;
            background-color: #000;
            color: #fff;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            position: relative;
            transform: skew(-20deg); /* Button skew */
            box-sizing: border-box;
        }

        /* Correct button text (un-skew text) */
        .terminal-button span {
            display: inline-block;
            transform: skew(20deg); /* Un-skew button text */
        }

        /* Button content flex centering */
        .terminal-button span {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Icons as dark images with subtle shade */
        .icon {
            width: 24px;
            height: 24px;
            filter: invert(1); /* Invert to make dark icons visible but shaded */
            opacity: 0.5; /* Shaded dark appearance */
        }

        /* Bottom flex layout */
        .bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 20px;
            left: 0;
            gap: 10px;
            text-align: center;
        }

        /* Time variable (can be updated dynamically) */
        .sys-time {
            color: #ff00ff;
        }
    </style>
</head>
<body>

    <div class="terminal-container">

        <div class="top-bar">
            <div class="pink-text">[ NEURAL NETWORK: ONLINE ]</div>
            <div class="pink-text">[ SYS.TIME: <span id="time" class="sys-time">22:04</span> ]</div>
        </div>

        <h1 class="worm-title">WORM</h1>

        <div class="glowing-box">
            <div class="button-row">
                <button class="terminal-button"><span>SYSTEM LOGIN</span></button>
                <img src="https://img.icons8.com/material-rounded/24/000000/lock.png" alt="Lock Icon" class="icon">
            </div>
            <div class="button-row">
                <button class="terminal-button"><span>ACCESS LIBRARY</span></button>
                <img src="https://img.icons8.com/material-rounded/24/000000/folder-invoices.png" alt="Folder Icon" class="icon">
            </div>
            <div class="button-row">
                <button class="terminal-button"><span>OPTIONS</span></button>
                <img src="https://img.icons8.com/material-rounded/24/000000/settings.png" alt="Gear Icon" class="icon">
            </div>
        </div>

        <div class="bottom-bar">
            <div class="pink-text">SYSTEM VERSION 2.0.1</div>
            <div class="pink-text">THIS PROJECT WAS CREATED BY zenith786</div>
        </div>

    </div>

    <script>
        function updateTime() {
            const timeSpan = document.getElementById('time');
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeSpan.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000); // Update every second
        updateTime(); // Initial update
    </script>
</body>
</html>
