<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORM | Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@200;700&display=swap');
        
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Crimson Pro', serif; 
            overflow: hidden; 
        }

        .bg-overlay {
            background: linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, #050505 90%), 
                        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0; left: 0;
            z-index: -1;
            filter: grayscale(0.5) brightness(0.7);
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center px-6">
    
    <div class="bg-overlay"></div>

    <div class="text-center space-y-8 fade-in">
        <h1 class="text-7xl font-extralight tracking-[0.6em] uppercase glow-text">WORM</h1>
        <p class="text-blue-500 tracking-[0.8em] text-[10px] font-bold uppercase opacity-60">System Interface v1.0</p>
        
        <div class="pt-16">
            <a href="toc.html" class="group relative border border-white/10 px-16 py-5 overflow-hidden transition-all duration-500 hover:border-blue-500">
                <span class="relative z-10 tracking-[0.5em] uppercase text-[10px] group-hover:text-blue-400 transition-colors">Enter Library</span>
                <div class="absolute inset-0 bg-blue-500/5 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
            </a>
        </div>
    </div>

</body>
</html>
