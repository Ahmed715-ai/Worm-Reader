<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WORM | Neon System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background-color: #090005; 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden;
        }

        /* The Cyberpunk Pinterest Background! */
        .bg-cyber {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                linear-gradient(to bottom, rgba(15, 0, 10, 0.8), rgba(0, 0, 0, 0.95)),
                url('https://i.pinimg.com/1200x/7b/0a/56/7b0a56f95df7e34b9dfa24c3e02cc8e4.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Massive, glowing title - SPREAD OUT */
        .title-neon {
            font-family: 'Orbitron', sans-serif;
            font-size: 6rem; 
            font-weight: 900;
            color: #ff2a85;
            text-transform: uppercase;
            letter-spacing: 0.4em; 
            text-shadow: 0 0 10px #ff2a85, 0 0 30px #ff2a85, 0 0 60px #ff2a85;
            margin-bottom: 2rem;
            margin-left: 0.4em; 
        }

        /* The Hot Neon Box */
        .neon-box {
            border: 3px solid #ff2a85;
            background: rgba(255, 42, 133, 0.02);
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.4), inset 0 0 15px rgba(255, 42, 133, 0.1);
            backdrop-filter: blur(4px);
            padding: 3rem 4rem;
            border-radius: 16px;
            width: 100%;
            max-w: 600px;
        }

        /* The Gritty Black Boxes for the Menu Links */
        .menu-item {
            display: block;
            background-color: #050002; 
            border: 1px solid rgba(255, 42, 133, 0.3); 
            padding: 1rem 3rem;
            font-size: 1.5rem; 
            font-weight: 700;
            letter-spacing: 0.2em;
            color: #fbcfe8;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            cursor: pointer;
            text-align: center;
            transform: skew(-5deg); 
            box-shadow: 5px 5px 0px rgba(255, 42, 133, 0.2);
        }

        /* Un-skews the text inside so it's readable */
        .menu-item span {
            display: inline-block;
            transform: skew(5deg);
        }

        .menu-item:last-child { margin-bottom: 0; }

        /* Neon Hover Effect on the Black Boxes */
        .menu-item:hover {
            background-color: #ff2a85;
            color: #fff;
            border-color: #ff2a85;
            text-shadow: 0 0 10px #fff;
            box-shadow: 5px 5px 15px #ff2a85;
            transform: skew(-5deg) scale(1.05);
        }

        /* The Pink Scrolling Thingy */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #090005; }
        ::-webkit-scrollbar-thumb { 
            background: #ff2a85; 
            border-radius: 10px; 
            border: 2px solid #090005;
        }
        ::-webkit-scrollbar-thumb:hover { background: #ff7ebb; box-shadow: 0 0 10px #ff2a85; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-6">
    
    <div class="bg-cyber"></div>

    <div id="cyber-clock" class="absolute top-6 right-6 font-mono text-pink-500 text-lg tracking-widest animate-pulse font-bold">
        [ SYS.TIME: 00:00:00 ]
    </div>

    <div class="z-10 flex flex-col items-center w-full max-w-3xl">
        
        <div class="text-pink-400 text-sm tracking-[0.5em] mb-4 uppercase font-bold text-shadow-md">
            [ Neural Network: Online ]
        </div>

        <h1 class="title-neon">WORM</h1>

        <div class="neon-box mt-4">
            <nav class="flex flex-col items-center w-full px-8">
                <a href="login.html" class="menu-item w-full"><span>System Login</span></a>
                <a href="toc.html" class="menu-item w-full"><span>Access Library</span></a>
                <a href="#" class="menu-item w-full opacity-50 cursor-not-allowed"><span>Options</span></a>
            </nav>
        </div>

        <div class="mt-16 text-pink-300/60 text-xs tracking-[0.4em] uppercase font-bold text-center">
            System Version 2.0.1 <br><br>
            <span class="text-pink-500">This project was created by zenith786</span>
        </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('cyber-clock').textContent = `[ SYS.TIME: ${timeString} ]`;
        }
        setInterval(updateClock, 1000);
        updateClock(); 
    </script>
</body>
</html>
