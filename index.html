<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WORM | Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@200;700&family=Inter:wght@300&display=swap');
        
        body { background-color: #020202; color: white; font-family: 'Crimson Pro', serif; overflow: hidden; }

        .bg-overlay {
            background: linear-gradient(to bottom, rgba(2,2,2,0.6) 0%, #020202 95%), 
                        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center;
            height: 100vh; width: 100vw; position: absolute;
            top: 0; left: 0; z-index: -1; filter: brightness(0.5);
        }

        .glow-title {
            letter-spacing: 0.8em;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center px-6">
    <div class="bg-overlay"></div>

    <div class="text-center space-y-12">
        <div>
            <h1 class="text-7xl font-extralight uppercase glow-title ml-[0.8em]">WORM</h1>
            <p class="text-blue-500 font-sans tracking-[0.6em] text-[9px] font-bold uppercase mt-4 opacity-70">Parahuman x TVD Revision</p>
        </div>
        
        <div class="pt-8">
            <a href="toc.html" class="inline-block border border-white/10 px-20 py-4 hover:border-blue-500 hover:bg-blue-500/5 transition-all duration-700 group">
                <span class="text-[10px] tracking-[0.4em] uppercase font-sans group-hover:text-blue-400 transition-colors">Enter Library</span>
            </a>
        </div>
    </div>
</body>
</html>
