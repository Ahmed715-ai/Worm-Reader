<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WORM | System Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background-color: #090005; 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif; 
            overflow: hidden;
        }

        .bg-cyber {
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(to bottom, rgba(15, 0, 10, 0.7), rgba(0, 0, 0, 0.95)),
                url('https://i.pinimg.com/1200x/7b/0a/56/7b0a56f95df7e34b9dfa24c3e02cc8e4.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* The glowing pink box from your screenshot */
        .login-box {
            background-color: rgba(5, 0, 2, 0.85);
            border: 2px solid #ff2a85;
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.6);
        }

        .neon-input {
            background-color: #050002;
            border: 1px solid rgba(255, 42, 133, 0.5);
            color: #ff2a85;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .neon-input:focus {
            border-color: #ff2a85;
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.8);
        }

        .btn-skew {
            display: inline-block;
            background-color: #050002; 
            border: 1px solid #ff2a85; 
            padding: 1.2rem;
            font-size: 1.5rem; 
            font-weight: 900;
            color: #ffffff; 
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            transform: skew(-5deg); 
            box-shadow: 6px 6px 0px rgba(255, 42, 133, 0.3);
            width: 100%;
        }

        .btn-skew:hover {
            background-color: #ff2a85;
            box-shadow: 0 0 20px #ff2a85;
            text-shadow: 0 0 10px #fff;
        }

        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: black;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-6">
    
    <div class="bg-cyber"></div>

    <div id="loading-overlay">
        <div class="text-[#ff2a85] font-['Orbitron'] text-2xl animate-pulse mb-4 tracking-[0.5em]">INITIALIZING UPLINK</div>
        <div class="w-64 h-1 bg-gray-900 overflow-hidden">
            <div id="progress-bar" class="h-full bg-[#ff2a85] w-0 transition-all duration-1000"></div>
        </div>
    </div>

    <div class="z-10 w-full max-w-md flex flex-col items-center">
        <h1 class="font-['Orbitron'] text-5xl font-black text-[#ff2a85] tracking-[0.2em] uppercase mb-2 text-center" style="text-shadow: 0 0 15px #ff2a85;">
            AUTHORIZATION
        </h1>
        <p class="text-pink-400 text-sm tracking-[0.3em] mb-10 uppercase font-bold">[ SECURE NEURAL UPLINK ]</p>

        <div class="login-box w-full p-10 rounded-lg flex flex-col gap-8">
            
            <div class="flex flex-col gap-4">
                <label class="text-white text-sm tracking-[0.3em] uppercase font-bold text-center italic">What is your name, Operator?</label>
                <input type="text" id="userName" placeholder="ENTER NAME" class="neon-input w-full p-4 text-center text-2xl rounded-sm uppercase" autocomplete="off">
            </div>

            <button onclick="saveAndGo()" class="btn-skew">
                <span>AUTHENTICATE</span>
            </button>
            
            <div class="flex justify-between items-center mt-2 px-2">
                <a href="index.html" class="text-pink-400/60 hover:text-white text-[10px] tracking-widest uppercase transition-all font-bold">< RETURN TO MENU</a>
                <a href="#" onclick="saveAndGo('Guest')" class="text-pink-400/60 hover:text-white text-[10px] tracking-widest uppercase transition-all font-bold italic">GUEST OVERRIDE ></a>
            </div>
        </div>
    </div>

    <script>
        function saveAndGo(guestName) {
            // Get value from box OR 'Guest' if link clicked OR 'Operator' if empty
            const name = guestName || document.getElementById('userName').value || 'Operator';
            
            // Save it for the TOC page
            localStorage.setItem('storedName', name);

            // Show animation
            document.getElementById('loading-overlay').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('progress-bar').style.width = '100%';
            }, 100);

            // Jump to TOC
            setTimeout(() => {
                window.location.href = "toc.html";
            }, 1600);
        }
    </script>
</body>
</html>
