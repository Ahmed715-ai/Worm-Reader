<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORM | Access Library</title>

    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/cherry-blossom.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background-color: #090005; 
            color: #d1d5db; 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden;
        }

        /* --- PROGRESS BAR --- */
        #progress-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255, 42, 133, 0.1);
            z-index: 100;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: #ff2a85;
            box-shadow: 0 0 10px #ff2a85;
            transition: width 0.2s ease;
        }

        .bg-cyber-toc {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                linear-gradient(to right, rgba(10, 0, 5, 0.95) 0%, rgba(10, 0, 5, 0.7) 50%, rgba(0, 0, 0, 0.9) 100%),
                url('https://i.pinimg.com/736x/f3/92/c9/f392c9ccc2e61327f29273c8af829081.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .text-neon-pink {
            color: #ff2a85;
            text-shadow: 0 0 5px rgba(255, 42, 133, 0.5), 0 0 15px rgba(255, 42, 133, 0.3);
        }

        .title-neon {
            font-family: 'Orbitron', sans-serif;
            color: #ff2a85;
            text-shadow: 0 0 10px #ff2a85, 0 0 20px #ff2a85;
        }

        /* --- SEARCH BAR --- */
        #archive-search {
            width: 100%;
            background: rgba(255, 42, 133, 0.05);
            border: 1px solid rgba(255, 42, 133, 0.3);
            padding: 1rem 1.5rem;
            color: white;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            outline: none;
            border-radius: 4px;
            margin-bottom: 2rem;
        }

        /* --- CHAPTER BOXES & GLITCH --- */
        .chapter-box {
            background-color: #050002;
            border: 1px solid rgba(255, 42, 133, 0.2);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            text-decoration: none;
            color: inherit;
            margin-bottom: 1rem;
            position: relative;
        }

        /* Visited/Read Chapter Style */
        .chapter-box.read {
            border-color: rgba(255, 42, 133, 0.1);
            opacity: 0.6;
        }
        .chapter-box.read::after {
            content: "ARCHIVED";
            font-size: 0.6rem;
            color: #ff2a85;
            letter-spacing: 2px;
        }

        .chapter-box:hover {
            border-color: #ff2a85;
            box-shadow: 5px 5px 0px rgba(255, 42, 133, 0.3);
            transform: translateX(10px);
            color: white;
        }

        .glitch-text { position: relative; }
        .chapter-box:hover .glitch-text::before,
        .chapter-box:hover .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050002;
        }
        .chapter-box:hover .glitch-text::before {
            left: 2px; text-shadow: -2px 0 #ff2a85; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 20px, 0); }
            100% { clip: rect(80px, 9999px, 90px, 0); }
        }

        .arc-header {
            color: #ff2a85;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            padding-bottom: 0.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 42, 133, 0.3);
        }

        .sidebar-fixed { position: sticky; top: 2rem; }
    </style>
</head>
<body class="min-h-screen relative p-6 md:p-12">
    
    <div id="progress-container"><div id="progress-bar"></div></div>

    <div class="bg-cyber-toc"></div>

    <div class="z-10 max-w-6xl mx-auto flex flex-col md:flex-row gap-12 mt-8">
        
        <div class="w-full md:w-1/3 flex flex-col shrink-0">
            <div class="sidebar-fixed">
                <div class="relative w-full rounded-lg overflow-hidden border-2 border-pink-500 mb-6">
                    <img src="https://i.pinimg.com/736x/d4/c3/21/d4c32195c8b0d2150dbe8fa1f8a32b93.jpg" alt="Sakura" class="w-full h-auto object-cover opacity-90">
                </div>
                <h1 class="title-neon text-5xl font-black uppercase tracking-[0.2em] mb-2">WORM</h1>
                <p class="text-white text-xs tracking-[0.3em] uppercase mb-6">
                    Operator: <span id="user-display" class="text-neon-pink font-bold">...</span>
                </p>
                <a href="index.html" class="font-mono text-sm text-pink-500 hover:text-white transition-colors">
                    ← RETURN TO TERMINAL
                </a>
            </div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col pb-24">
            <input type="text" id="archive-search" placeholder="[ SEARCH_DATABASE... ]" onkeyup="searchChapters()">
            <div id="full-archive"></div>
        </div>
    </div>

    <script>
        const fullStoryList = [
            { arc: "Arc 1: Gestation", chaps: ["1.01", "1.02", "1.03", "1.04", "1.05", "1.06", "1.x (Danny)"] },
            { arc: "Arc 2: Insinuation", chaps: ["2.01", "2.02", "2.03", "2.04", "2.05", "2.06", "2.07", "2.08", "2.09", "2.x (Victoria)"] },
            // ... Add all other arcs here ...
        ];

        const container = document.getElementById('full-archive');
        
        // 1. SCROLL PROGRESS LOGIC
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        };

        // 2. RENDER & MARK READ
        function markAsRead(id) {
            let readChaps = JSON.parse(localStorage.getItem('readChapters') || "[]");
            if(!readChaps.includes(id)) readChaps.push(id);
            localStorage.setItem('readChapters', JSON.stringify(readChaps));
        }

        function renderLibrary() {
            const readChaps = JSON.parse(localStorage.getItem('readChapters') || "[]");
            fullStoryList.forEach(arcObj => {
                const header = document.createElement('div');
                header.className = 'arc-header';
                header.textContent = `[ ${arcObj.arc} ]`;
                container.appendChild(header);

                arcObj.chaps.forEach(ch => {
                    const box = document.createElement('a');
                    box.href = "#"; // Replace with your link
                    box.className = `chapter-box ${readChaps.includes(ch) ? 'read' : ''}`;
                    box.onclick = () => markAsRead(ch);
                    box.innerHTML = `<span class="glitch-text font-mono tracking-widest text-lg" data-text="Ch: ${ch}">Ch: ${ch}</span>`;
                    container.appendChild(box);
                });
            });
        }

        function searchChapters() {
            const input = document.getElementById('archive-search').value.toLowerCase();
            const boxes = document.getElementsByClassName('chapter-box');
            for (let box of boxes) {
                box.style.display = box.innerText.toLowerCase().includes(input) ? "flex" : "none";
            }
        }

        renderLibrary();
        document.getElementById('user-display').textContent = localStorage.getItem('storedName') || 'Guest';
    </script>
</body>
</html>
