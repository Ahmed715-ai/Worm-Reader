<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WORM | Access Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { background-color: #090005; color: #d1d5db; font-family: 'Rajdhani', sans-serif; overflow: hidden; height: 100vh; }

        .bg-cyber-toc {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to right, rgba(10, 0, 5, 0.95) 0%, rgba(10, 0, 5, 0.7) 50%, rgba(0, 0, 0, 0.9) 100%),
                url('https://i.pinimg.com/736x/f3/92/c9/f392c9ccc2e61327f29273c8af829081.jpg'); 
            background-size: cover; background-position: center; z-index: -1;
        }

        .title-neon { font-family: 'Orbitron', sans-serif; color: #ff2a85; text-shadow: 0 0 10px #ff2a85; }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255, 42, 133, 0.05); }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ff2a85; }

        /* Arc Selection Buttons */
        .arc-btn {
            padding: 10px 15px; border-left: 2px solid transparent;
            transition: 0.3s; cursor: pointer; text-transform: uppercase;
            font-size: 0.85rem; letter-spacing: 1px; color: #9ca3af;
        }
        .arc-btn:hover { color: #ff2a85; background: rgba(255, 42, 133, 0.05); }
        .arc-btn.active { border-left-color: #ff2a85; color: white; background: rgba(255, 42, 133, 0.1); }

        /* Chapter Boxes */
        .chapter-box {
            background-color: #050002; border: 1px solid rgba(255, 42, 133, 0.2);
            padding: 1rem 1.5rem; transition: 0.3s; display: flex;
            justify-content: space-between; align-items: center; text-decoration: none; color: inherit;
        }
        .chapter-box:hover { border-color: #ff2a85; transform: translateX(5px); color: white; }

        .hidden-arc { display: none; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="bg-cyber-toc"></div>

    <div class="max-w-7xl mx-auto h-full flex flex-col md:flex-row gap-8">
        
        <div class="w-full md:w-64 flex flex-col shrink-0">
            <h1 class="title-neon text-4xl font-black mb-4">WORM</h1>
            <div id="arc-list" class="flex flex-col overflow-y-auto custom-scroll pr-2 h-[60vh] border-r border-white/5">
                </div>
            <a href="index.html" class="mt-8 font-mono text-xs text-pink-500 hover:text-white transition-colors">← RETURN TO TERMINAL</a>
        </div>

        <div class="flex-1 flex flex-col h-[80vh]">
            <div id="active-arc-title" class="text-pink-400 text-xs tracking-[0.5em] mb-6 uppercase font-bold border-b border-pink-500/30 pb-2">
                SELECT AN ARC
            </div>
            
            <div id="chapter-list-container" class="grid grid-cols-1 lg:grid-cols-2 gap-3 overflow-y-auto custom-scroll pr-4">
                </div>
        </div>
    </div>

    <script>

            "Arc 3: Agitation": ["3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.x (Interlude; Wards)"],

            "Arc 6: Tangle": ["6.1", "6.2", "6.3", "6.4", "6.5", "6.6", "6.7", "6.8", "6.9", "6.x (Interlude; Canary)"],

            "Arc 9: Sentinel": ["9.1", "9.2", "9.3", "9.4", "9.5", "9.6"],

            "Arc 11: Infestation": ["11.1", "11.2", "11.3", "11.4", "11.5", "11.6", "11.7", "11.8", "11.a", "11.b", "11.c", "11.d", "11.e", "11.f", "11.g", "11.h"],
            "Arc 12: Plague": ["12.1", "12.2", "12.3", "12.4", "12.5", "12.6", "12.7", "12.8", "12.x (Interlude; Jack)", "12.x (Bonus Interlude; Jamie)"],
            "Arc 13: Snare": ["13.1", "13.2", "13.x (Bonus Interlude; Aisha)", "13.3", "13.4", "13.5", "13.6", "13.7", "13.8", "13.9", "13.10", "13.x (Interlude; Piggot)"],
            "Arc 14: Prey": ["14.1", "14.2", "14.3", "14.4", "14.5", "14.6", "14.7", "14.8", "14.9", "14.10", "14.11", "14.x (Interlude; Sierra)", "14.y (Bonus Interlude; Legend)"],

            "Arc 19: Scourge": ["19.1", "19.2", "19.3", "19.x", "19.4", "19.5", "19.6", "19.7", "19.y", "19.z"],

            "Arc 27: Extinction": ["27.1", "27.2", "27.3", "27.4", "27.5", "27.x", "27.y"],
            "Arc 28: Cockroaches": ["28.1", "28.2", "28.3", "28.4", "28.5", "28.6", "28.x"],
            "Arc 29: Venom": ["29.1", "29.2", "29.3", "29.4", "29.5", "29.6", "29.7", "29.8", "29.9", "29.x"],
            "Arc 30: Speck": ["30.1", "30.2", "30.3", "30.4", "30.5", "30.6", "30.7"],
            "Epilogue: Teneral": ["E.1", "E.2", "E.3", "E.4", "E.5", "E.x"]
        };

        function loadArc(arcName) {
            document.getElementById('active-arc-title').textContent = arcName;
            const container = document.getElementById('chapter-list-container');
            container.innerHTML = '';
            
            wormData[arcName].forEach(ch => {
                const safeName = ch.toLowerCase().replace(/\s+/g, '').replace(/[();,]/g, '');
                // Note: You'll need to name your files like 'gestation1.1.html' or similar
                const fileName = `gestation${ch}.html`.replace(/ /g, '');
                
                const a = document.createElement('a');
                a.href = fileName;
                a.className = 'chapter-box';
                a.innerHTML = `<span class="font-mono tracking-widest text-sm">CH ${ch}</span>`;
                container.appendChild(a);
            });

            // Update Active Button
            document.querySelectorAll('.arc-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === arcName);
            });
        }

        // Initialize Arc List
        const arcList = document.getElementById('arc-list');
        Object.keys(wormData).forEach(arc => {
            const div = document.createElement('div');
            div.className = 'arc-btn';
            div.textContent = arc;
            div.onclick = () => loadArc(arc);
            arcList.appendChild(div);
        });

        // Load Arc 1 by default
        loadArc("Arc 1: Gestation");
    </script>
</body>
</html>
