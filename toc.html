<!DOCTYPE html>

    <title>WORM | Access Library</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background-color: #090005; 
            color: #d1d5db; 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden;
        }

        .bg-cyber-toc {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                linear-gradient(to right, rgba(10, 0, 5, 0.95) 0%, rgba(10, 0, 5, 0.7) 50%, rgba(0, 0, 0, 0.9) 100%),
                url('https://i.pinimg.com/736x/f3/92/c9/f392c9ccc2e61327f29273c8af829081.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .text-neon-pink {
            color: #ff2a85;
            text-shadow: 0 0 5px rgba(255, 42, 133, 0.5), 0 0 15px rgba(255, 42, 133, 0.3);
        }

        .title-neon {
            font-family: 'Orbitron', sans-serif;
            color: #ff2a85;
            text-shadow: 0 0 10px #ff2a85, 0 0 20px #ff2a85;
        }

        .chapter-box {
            background-color: #050002;
            border: 1px solid rgba(255, 42, 133, 0.2);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            text-decoration: none;
            color: inherit;
            margin-bottom: 1rem;
        }

        .chapter-box:hover {
            border-color: #ff2a85;
            box-shadow: 5px 5px 0px rgba(255, 42, 133, 0.3);
            transform: translateX(10px);
            color: white;
        }

        .arc-header {
            color: #ff2a85;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            padding-bottom: 0.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 42, 133, 0.3);
        }

        /* Full page layout matching your screenshot */
        .sidebar-fixed { position: sticky; top: 2rem; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050002; }
        ::-webkit-scrollbar-thumb { background: #ff2a85; border-radius: 4px; }
    </style>
</head>

        fullStoryList.forEach(arcObj => {
            const header = document.createElement('div');
            header.className = 'arc-header';
            header.textContent = `[ ${arcObj.arc} ]`;
            container.appendChild(header);

            arcObj.chaps.forEach(ch => {
                const chClean = ch.split(' ')[0].replace('.', '-');
                const link = `gestation${chClean}.html`;
                
                const box = document.createElement('a');
                box.href = link;
                box.className = 'chapter-box';
