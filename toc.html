<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORM | Access Library</title>

    <link id="favicon" rel="icon" type="image/png" href="https://img.icons8.com/color/48/cherry-blossom.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        :root {
            --neon-color: #ff2a85; /* Default Pink */
            --neon-shadow: rgba(255, 42, 133, 0.5);
        }

        body { 
            background-color: #090005; 
            color: #d1d5db; 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* --- THEME SYSTEM --- */
        .text-neon {
            color: var(--neon-color);
            text-shadow: 0 0 5px var(--neon-shadow), 0 0 15px var(--neon-shadow);
        }

        .title-neon {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-color);
            text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
        }

        #progress-bar {
            height: 100%; width: 0%;
            background: var(--neon-color);
            box-shadow: 0 0 10px var(--neon-color);
        }

        /* --- SIDEBAR THEME BUTTONS --- */
        .theme-orb {
            width: 20px; height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }
        .theme-orb:hover { transform: scale(1.2); }

        /* --- BOXES --- */
        .chapter-box {
            background-color: #050002;
            border: 1px solid var(--neon-shadow);
            border-radius: 8px;
            padding: 1.2rem 2rem;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            text-decoration: none;
            color: inherit;
            margin-bottom: 0.8rem;
        }

        .chapter-box:hover {
            border-color: var(--neon-color);
            box-shadow: 5px 5px 0px var(--neon-shadow);
            transform: translateX(10px);
            color: white;
        }

        .arc-header {
            color: var(--neon-color);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            padding-bottom: 0.5rem;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--neon-shadow);
        }

        #archive-search {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-shadow);
            padding: 1rem 1.5rem;
            color: white;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            border-radius: 4px;
            margin-bottom: 2rem;
        }

        /* Glitch Animation using Variable */
        .glitch-text { position: relative; }
        .chapter-box:hover .glitch-text::before {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 2px; width: 100%; height: 100%;
            background: #050002;
            text-shadow: -2px 0 var(--neon-color);
            clip: rect(10px, 9999px, 20px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 20px, 0); }
            100% { clip: rect(40px, 9999px, 50px, 0); }
        }

        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.1); z-index: 100; }
        .sidebar-fixed { position: sticky; top: 2rem; }
    </style>
</head>
<body class="min-h-screen relative p-6 md:p-12">
    
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div class="fixed top-0 left-0 w-full h-full bg-[url('https://i.pinimg.com/736x/f3/92/c9/f392c9ccc2e61327f29273c8af829081.jpg')] bg-cover bg-center opacity-20 -z-10"></div>

    <div class="z-10 max-w-6xl mx-auto flex flex-col md:flex-row gap-12 mt-8">
        
        <div class="w-full md:w-1/3 flex flex-col shrink-0">
            <div class="sidebar-fixed">
                <div class="relative w-full rounded-lg overflow-hidden border-2 border-white/20 mb-6">
                    <img src="https://i.pinimg.com/736x/d4/c3/21/d4c32195c8b0d2150dbe8fa1f8a32b93.jpg" alt="Sakura" class="w-full h-auto object-cover">
                </div>
                
                <h1 class="title-neon text-5xl font-black mb-2">WORM</h1>
                
                <div class="flex gap-4 mb-6 items-center">
                    <span class="text-xs uppercase tracking-widest opacity-50">Theme:</span>
                    <div class="theme-orb bg-[#ff2a85]" onclick="setTheme('#ff2a85', 'https://img.icons8.com/color/48/cherry-blossom.png')"></div>
                    <div class="theme-orb bg-[#00fff9]" onclick="setTheme('#00fff9', 'https://img.icons8.com/fluency/48/water-element.png')"></div>
                    <div class="theme-orb bg-[#39ff14]" onclick="setTheme('#39ff14', 'https://img.icons8.com/color/48/leaf.png')"></div>
                </div>

                <p class="text-white text-xs tracking-[0.3em] uppercase mb-6">
                    Operator: <span id="user-display" class="text-neon font-bold">...</span>
                </p>
                
                <a href="index.html" class="font-mono text-sm opacity-50 hover:opacity-100 transition-opacity">
                    ← RETURN TO TERMINAL
                </a>
            </div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col pb-24">
            <input type="text" id="archive-search" placeholder="[ SEARCH_DATABASE... ]" onkeyup="searchChapters()">
            <div id="full-archive"></div>
        </div>
    </div>

    <script>
        // --- DATASET ---
        const fullStoryList = [
            { arc: "Arc 1: Gestation", chaps: ["1.01", "1.02", "1.03", "1.04", "1.05", "1.06", "1.x (Danny)"] },
            { arc: "Arc 2: Insinuation", chaps: ["2.01", "2.02", "2.03", "2.04", "2.05", "2.06", "2.07", "2.08", "2.09", "2.x (Victoria)"] },
            { arc: "Arc 3: Agitation", chaps: ["3.01", "3.02", "3.03", "3.04", "3.05", "3.06", "3.07", "3.08", "3.09", "3.10", "3.11", "3.12", "3.x (Wards)"] },
            { arc: "Arc 4: Shell", chaps: ["4.01", "4.02", "4.03", "4.04", "4.05", "4.06", "4.07", "4.08", "4.09", "4.10", "4.11", "4.x (Purity)", "4.x (Brutus)"] },
            { arc: "Arc 5: Hive", chaps: ["5.01", "5.02", "5.03", "5.04", "5.05", "5.06", "5.07", "5.08", "5.09", "5.10", "5.x (Gregor)"] },
            { arc: "Arc 6: Tangle", chaps: ["6.01", "6.02", "6.03", "6.04", "6.05", "6.06", "6.07", "6.08", "6.09", "6.x (Canary)"] },
            { arc: "Arc 7: Buzz", chaps: ["7.01", "7.02", "7.03", "7.04", "7.05", "7.06", "7.07", "7.08", "7.09", "7.10", "7.11", "7.12", "7.x (Hannah)"] },
            { arc: "Arc 8: Extermination", chaps: ["8.01", "8.02", "8.03", "8.04", "8.05", "8.06", "8.07", "8.08", "8.x (Lisa)", "8.x (Coil)"] },
            { arc: "Arc 9: Sentinel", chaps: ["9.01", "9.02", "9.03", "9.04", "9.05", "9.06"] },
            { arc: "Arc 10: Parasite", chaps: ["10.01", "10.02", "10.03", "10.04", "10.05", "10.06", "10.x (Alec)", "10.x (Dragon)"] },
            { arc: "Arc 11: Infestation", chaps: ["11.01", "11.02", "11.03", "11.04", "11.05", "11.06", "11.07", "11.08", "11.a", "11.b", "11.c", "11.d", "11.e", "11.f", "11.g", "11.h"] },
            { arc: "Arc 12: Plague", chaps: ["12.01", "12.02", "12.03", "12.04", "12.05", "12.06", "12.07", "12.08", "12.x (Jack)", "12.x (Jamie)"] },
            { arc: "Arc 13: Snare", chaps: ["13.01", "13.02", "13.x (Aisha)", "13.03", "13.04", "13.05", "13.06", "13.07", "13.08", "13.09", "13.10", "13.x (Piggot)"] },
            { arc: "Arc 14: Prey", chaps: ["14.1", "14.2", "14.3", "14.4", "14.5", "14.6", "14.7", "14.8", "14.9", "14.10", "14.11", "14.x (Sierra)", "14.y (Legend)"] },
            { arc: "Arc 15: Colony", chaps: ["15.1", "15.x (Carol)", "15.2", "15.3", "15.y (2nd Trigger)", "15.4", "15.5", "15.6", "15.7", "15.z (Alexandria)", "15.8", "15.9", "15.10", "15.x (Rory)"] },
            { arc: "Arc 16: Monarch", chaps: ["16.1", "16.2", "16.x (PRT)", "16.3", "16.4", "16.5", "16.6", "16.y (Defiant)", "16.7", "16.8", "16.9", "16.10", "16.z (Marquis)", "16.11", "16.12", "16.13"] },
            { arc: "Arc 17: Migration", chaps: ["17.1", "17.2", "17.3", "17.4", "17.5", "17.6", "17.7", "17.8"] },
            { arc: "Arc 18: Queen", chaps: ["18.1", "18.2", "18.x (Scion)", "18.3", "18.4", "18.y (Crusader)", "18.5", "18.6", "18.z (Jessica)", "18.7", "18.8", "18.z (Faultline)", "18.z (Echidna)"] },
            { arc: "Arc 19: Scourge", chaps: ["19.1", "19.2", "19.3", "19.x (Blasto)", "19.4", "19.5", "19.6", "19.7", "19.y (PHO)", "19.z (Emma)"] },
            { arc: "Arc 20: Chrysalis", chaps: ["20.1", "20.2", "20.3", "20.4", "20.5", "20.x (Stan)", "20.y (Accord)"] },
            { arc: "Arc 21: Imago", chaps: ["21.1", "21.2", "21.3", "21.4", "21.5", "21.6", "21.7", "21.x (Number Man)", "21.y (Parian)"] },
            { arc: "Arc 22: Cell", chaps: ["22.1", "22.2", "22.3", "22.4", "22.5", "22.6", "22.x (Charlotte)", "22.y (Lung)"] },
            { arc: "Arc 23: Drone", chaps: ["23.1", "23.2", "23.3", "23.4", "23.5", "23.x (Thirty-Six)"] },
            { arc: "Arc 24: Crushed", chaps: ["24.1", "24.2", "24.3", "24.4", "24.5", "24.x (Chevalier)", "24.y (Aftermath)"] },
            { arc: "Arc 25: Scarab", chaps: ["25.1", "25.2", "25.3", "25.4", "25.5", "25.6", "25.x (Bonesaw)"] },
            { arc: "Arc 26: Sting", chaps: ["26.1", "26.2", "26.3", "26.x (Saint)", "26.4", "26.5", "26.6", "26.a", "26.b", "26.x"] },
            { arc: "Arc 27: Extinction", chaps: ["27.1", "27.2", "27.3", "27.4", "27.5", "27.x (Eidolon)", "27.y (Addendum)"] },
            { arc: "Arc 28: Cockroaches", chaps: ["28.1", "28.2", "28.3", "28.4", "28.5", "28.6", "28.x"] },
            { arc: "Arc 29: Venom", chaps: ["29.1", "29.2", "29.3", "29.4", "29.5", "29.6", "29.7", "29.8", "29.9", "29.x (Fortuna)"] },
            { arc: "Arc 30: Speck", chaps: ["30.1", "30.2", "30.3", "30.4", "30.5", "30.6", "30.7"] },
            { arc: "Epilogue: Teneral", chaps: ["E.1", "E.2", "E.3", "E.4", "E.5", "E.x"] }
        ];

        // --- THEME SWITCHER LOGIC ---
        function setTheme(color, iconUrl) {
            document.documentElement.style.setProperty('--neon-color', color);
            // Create a semi-transparent version for shadows
            document.documentElement.style.setProperty('--neon-shadow', color + '80'); 
            
            // Swap Favicon
            document.getElementById('favicon').href = iconUrl;
            
            // Save preference
            localStorage.setItem('userTheme', color);
            localStorage.setItem('userIcon', iconUrl);
        }

        // --- CORE RENDER ---
        const container = document.getElementById('full-archive');
        document.getElementById('user-display').textContent = localStorage.getItem('storedName') || 'Guest';

        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        };

        function render() {
            fullStoryList.forEach(arcObj => {
                const header = document.createElement('div');
                header.className = 'arc-header';
                header.textContent = `[ ${arcObj.arc} ]`;
                container.appendChild(header);

                arcObj.chaps.forEach(ch => {
                    const chClean = ch.split(' ')[0].replace('.', '-');
                    const link = `gestation${chClean}.html`;
                    const box = document.createElement('a');
                    box.href = link;
                    box.className = 'chapter-box';
                    box.setAttribute('data-keywords', `${arcObj.arc} ${ch}`.toLowerCase());
                    box.innerHTML = `<span class="glitch-text font-mono tracking-widest text-lg" data-text="Ch: ${ch}">Ch: ${ch}</span>`;
                    container.appendChild(box);
                });
            });
        }

        function searchChapters() {
            const input = document.getElementById('archive-search').value.toLowerCase();
            const boxes = document.getElementsByClassName('chapter-box');
            const headers = document.getElementsByClassName('arc-header');
            for (let box of boxes) { box.style.display = box.getAttribute('data-keywords').includes(input) ? "flex" : "none"; }
            for (let header of headers) {
                let next = header.nextElementSibling;
                let visible = false;
                while(next && !next.classList.contains('arc-header')) {
                    if(next.style.display !== 'none') visible = true;
                    next = next.nextElementSibling;
                }
                header.style.display = visible ? "block" : "none";
            }
        }

        // Load saved theme on boot
        const savedTheme = localStorage.getItem('userTheme');
        const savedIcon = localStorage.getItem('userIcon');
        if(savedTheme) setTheme(savedTheme, savedIcon);

        render();
    </script>
</body>
</html>
